[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

# Pinned to 0.8.28 because the EAS contracts pin exactly that, and a test that drives the real
# EAS has to compile in one unit with it. Pinning the whole project rather than letting versions
# drift per file means the bytecode the tests exercise is the bytecode that gets deployed.
solc = "0.8.28"
# EIP-7702 (set-code transactions) requires Prague or later, which 0.8.28 supports.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false
# The deploy script writes an address book the web app and indexer read directly, so no
# address is ever transcribed by hand. Scoped to that one directory.
fs_permissions = [{access = "read-write", path = "./deployments"}]

[lint]
severity = ["high", "medium", "low"]
# A cooldown IS a timestamp comparison, so this lint fires on essentially every line of the
# policy. Proposer timestamp drift is bounded at a few seconds; the shortest cooldown the
# contracts accept is measured in minutes and the intended values in hours. Suppressed here
# rather than with a dozen identical inline comments. Every other lint stays on.
exclude_lints = ["block-timestamp"]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 128
depth = 48
fail_on_revert = false
call_override = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 384
depth = 64

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first_multi"
number_underscore = "thousands"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
