name: Release

# Publishes the browser extension as a GitHub Release when a version tag is pushed:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The tag has to match the version in apps/extension/package.json, which is what Chrome displays
# as the extension's version: a release called v0.2.0 that installs as 0.1.0 is refused rather than
# published. The extension's own typecheck and tests run first, because CI does not run on tags and
# a release should never be a build that nothing checked.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # Also builds @truesend/engine, which the extension bundles (tools/build-libs.mjs).
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      - name: Tag matches the extension's version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/extension/package.json, which says $version." >&2
            exit 1
          fi

      - name: Typecheck and test
        run: |
          pnpm --filter @truesend/extension typecheck
          pnpm --filter @truesend/extension test

      - name: Build the zip
        run: pnpm --filter @truesend/extension zip

      # The GitHub CLI is preinstalled on the runner, so publishing needs no third-party action.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls apps/extension/.output/*-chrome.zip)
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "TrueSend $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
