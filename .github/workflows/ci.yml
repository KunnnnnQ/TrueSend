name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Slither needs a solc. The toolchain above already downloaded the 0.8.28 the project pins,
      # and crytic-compile finds it — so there is no solc-select step here on purpose: a second
      # source of truth for the compiler version is how the analysed bytecode stops matching the
      # deployed bytecode.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned. The reentrancy conclusion in docs/static-analysis.md is a statement about what
      # this analyser does and does not detect, and an unpinned version would make it a statement
      # about whatever was current the last time CI ran.
      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Formatting
        run: forge fmt --check
        working-directory: contracts

      # `forge build` runs the linter too; `--deny warnings` makes an unreviewed warning fail the
      # build rather than scroll past. Every suppression in the tree carries a written reason.
      #
      # This also has to run *before* the Slither step below, which is not obvious: `forge build`
      # is what makes solc 0.8.28 present on the runner. Slither would otherwise go looking for a
      # compiler the project never fetched.
      - name: Build and lint
        run: forge build --deny warnings
        working-directory: contracts

      # Slither asks forge for the project config, so it has to run from inside `contracts/` with
      # foundry on PATH. The filter list lives in slither.config.json at the repo root; the config
      # is passed by path rather than picked up implicitly so the two stay visibly connected.
      #
      # `--fail-pedantic` fails on any result, informational included, which is what makes this a
      # gate rather than a log: a detector that starts firing has to be triaged in writing in
      # docs/static-analysis.md or explicitly excluded, and neither happens by accident.
      - name: Static analysis
        run: |
          slither . --compile-force-framework foundry \
            --config-file ../slither.config.json --fail-pedantic
        working-directory: contracts

      # The `ci` profile raises fuzz runs and invariant depth well above the local defaults, so
      # the campaign that guards the core property gets a real workout on every push.
      - name: Tests
        run: forge test -vvv
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci

      # Floors live in tools/coverage-gate.mjs, set at what the suite achieves rather than at a
      # round number: the point is to stop a regression, not to hit a target.
      - name: Coverage floor
        run: forge coverage --no-match-coverage "test|script" --report summary | node ../tools/coverage-gate.mjs
        working-directory: contracts

      # The ABIs are generated from this build and committed, so the app and the indexer stay
      # buildable without Foundry installed. Regenerating here catches the case where a contract
      # signature changed and the checked-in copy was left behind.
      - name: ABIs are current
        run: |
          node packages/chain/scripts/extract-abi.mjs
          git diff --exit-code -- packages/chain/src/abi

  engine:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # The extension's postinstall generates WXT's types, which the typecheck needs.
          NODE_ENV: development

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Replays the detector over the committed mainnet sample and fails if the headline
      # detection rates regress. Reads data/, never the network, so CI needs no RPC.
      - name: Mainnet replay
        run: node src/evaluate-engine.mjs --check
        working-directory: analysis
